<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Smart Nearby Recommender</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <link rel="stylesheet" href="style.css" />
</head>

<body>
  <div class="container">

    <!-- MOOD SCREEN -->
    <div id="moodScreen">
      <h1>📍 Smart Nearby</h1>
      <p>Select your mood</p>

      <div class="moods">
        <button onclick="showPlaces('work')">💼 Work</button>
        <button onclick="showPlaces('date')">❤️ Date</button>
        <button onclick="showPlaces('quick')">🍔 Quick Bite</button>
        <button onclick="showPlaces('budget')">💰 Budget</button>
      </div>
    </div>

    <!-- RESULT SCREEN -->
    <div id="resultScreen" style="display:none;">
      <button class="backBtn" onclick="goBack()">← Back</button>
      <h2 id="resultTitle"></h2>
      <div id="results"></div>
    </div>

  </div>

  <script src="script.js"></script>
</body>
</html>
